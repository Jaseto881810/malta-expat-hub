# Builds the website from content/ and publishes it to GitHub Pages.
# Runs on every change to main (including saves from the admin panel).
# On other branches and pull requests it only checks that the site builds.
name: Build and publish website

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build pages
        run: python build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build content CSS
        run: npx --yes tailwindcss@3.4 -c tailwind.config.js -i assets/content.src.css -o _site/assets/content.css --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
