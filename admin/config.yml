# Admin panel settings (Sveltia CMS).
# Open https://maltaexpatguide.com/admin/ and choose "Sign In with Token".

backend:
  name: github
  repo: Jaseto881810/malta-expat-hub
  branch: main
  commit_messages:
    create: "Add {{collection}} page “{{slug}}”"
    update: "Update {{collection}} page “{{slug}}”"
    delete: "Delete {{collection}} page “{{slug}}”"

site_url: https://maltaexpatguide.com
display_url: https://maltaexpatguide.com

# Uploaded photos are stored here.
media_folder: assets/images
public_folder: /assets/images

collections:
  - name: home
    label: Home page
    description: The text and photos on the home page.
    files:
      - name: home
        label: Home page
        file: content/home.md
        format: frontmatter
        fields:
          - { label: Big photo at the top, name: heroImage, widget: image }
          - { label: Photo description, name: heroImageAlt, widget: string, required: false }
          - { label: Small line above the heading, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro text, name: intro, widget: text, required: false }
          - { label: "Red badge: number", name: badgeNumber, widget: string, required: false, hint: "For example 300+. Leave empty to hide the badge." }
          - { label: "Red badge: text", name: badgeText, widget: string, required: false }
          - { label: "'Where are you in your move?' title", name: stagesTitle, widget: string, required: false }
          - label: Move stages
            name: stages
            widget: list
            label_singular: stage
            summary: "{{fields.label}}"
            required: false
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Colour, name: colour, widget: color, required: false }
              - label: Links
                name: links
                widget: list
                label_singular: link
                summary: "{{fields.text}}"
                required: false
                fields:
                  - { label: Link text, name: text, widget: string }
                  - { label: Link address, name: url, widget: string, hint: "For example /expat-info/healthcare.html" }
          - { label: "'Explore the guide' title", name: exploreTitle, widget: string, required: false, hint: "The section tiles below it come from Sections." }
          - { label: "'Quick things to know' title", name: factsTitle, widget: string, required: false }
          - { label: "'Quick things to know' text", name: factsText, widget: richtext, required: false }
          - { label: Weather title, name: weatherTitle, widget: string, required: false }
          - { label: Weather intro, name: weatherIntro, widget: text, required: false }
          - label: Seasons
            name: seasons
            widget: list
            label_singular: season
            summary: "{{fields.name}}"
            required: false
            fields:
              - { label: Season, name: name, widget: string }
              - { label: Temperature, name: temperature, widget: string, hint: "For example 30–35°C" }
              - { label: Months, name: months, widget: string }
              - { label: Colour, name: colour, widget: color, required: false }
              - { label: Text, name: text, widget: text }
          - { label: Weather notes title, name: weatherNotesTitle, widget: string, required: false }
          - { label: Weather notes, name: weatherNotes, widget: richtext, required: false, hint: "A bullet list works best." }
          - { label: Google description, name: description, widget: text, required: false }
          - { label: Browser tab title, name: seoTitle, widget: string, required: false }
          - { label: Social share photo (optional), name: shareImage, widget: image, required: false }

  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: News, tips and stories. The newest 3 posts also show on the home page.
    folder: content/blog
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.title}}"
    summary: "{{fields.title}}  ·  {{fields.date | date('D MMM YYYY')}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, time_format: false, date_format: "D MMM YYYY", format: "YYYY-MM-DD", hint: "A future date keeps the post hidden until that day (after the next save or site update)." }
      - { label: Short summary, name: excerpt, widget: text, hint: "One or two sentences. Shown on the blog cards and under the title." }
      - { label: Header photo, name: image, widget: image }
      - { label: Photo description, name: imageAlt, widget: string, required: false }
      - { label: Post text, name: body, widget: richtext, hint: "Use headings, lists, links and quotes. A quote (>) shows as a blue note box." }
      - { label: Hide this post (draft), name: draft, widget: boolean, required: false, default: false }
      - { label: Google description (optional), name: description, widget: text, required: false, hint: "Empty = uses the short summary" }
      - { label: Card photo (optional), name: cardImage, widget: image, required: false }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }

  - name: map
    label: Map places
    label_singular: Map place
    description: Pins on the interactive map at /map/. Find the latitude and longitude by right-clicking a spot on openstreetmap.org or Google Maps.
    folder: content/map
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: name
    slug: "{{fields.name}}"
    summary: "{{fields.name}}  ·  {{fields.area}}"
    view_groups:
      - { label: Category, field: category }
      - { label: Type, field: type }
    sortable_fields:
      fields: [name, category, type, area]
      default: { field: name }
    fields:
      - { label: Name, name: name, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - { label: Things to do, value: things-to-do }
          - { label: Hiking trails, value: hiking }
          - { label: Diving, value: diving }
          - { label: Beaches, value: beaches }
          - { label: Neighbourhoods, value: neighbourhoods }
          - { label: Expat services, value: expat-services }
          - { label: English schools, value: english-schools }
      - { label: Type, name: type, widget: string, required: false, hint: "Sub-group within the category, e.g. History & culture, Viewpoints, Nightlife, Wrecks, Sandy, Rocky, Gozo. Use the same spelling as other places." }
      - { label: Town or area, name: area, widget: string }
      - { label: Latitude, name: lat, widget: number, value_type: float, hint: "For example 35.8977 (Malta is around 35.8–36.1)" }
      - { label: Longitude, name: lng, widget: number, value_type: float, hint: "For example 14.5124 (Malta is around 14.18–14.58)" }
      - { label: Short description, name: text, widget: text, hint: "One or two short sentences." }
      - { label: Key facts (optional), name: details, widget: string, required: false, hint: "For example: 7 km · Moderate · Loop, or 15–36 m · Advanced" }
      - { label: "Rent level (neighbourhoods only)", name: price, widget: select, required: false, options: ["€", "€€", "€€€"] }
      - { label: Link to our guide (optional), name: guide, widget: string, required: false, hint: "For example /locations/swimming.html" }
      - { label: Website (optional), name: website, widget: string, required: false, hint: "Full address, starting with https://" }
      - { label: Hide this place, name: draft, widget: boolean, required: false, default: false }

  - name: guides
    label: Guides
    label_singular: Guide
    description: The guide pages inside each section (for example Healthcare or Renting).
    folder: content/guides
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: menuName
    slug: "{{fields.menuName}}"
    summary: "{{fields.menuName}}  ·  {{fields.section}}  ·  Updated {{commit_date | date('D MMM YYYY, HH:mm')}}"
    sortable_fields:
      fields: [menuName, section, order, commit_date]
      default: { field: section }
    view_groups:
      - { label: Section, field: section }
    fields:
      - label: Section
        name: section
        widget: relation
        collection: sections
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { label: Name in menu, name: menuName, widget: string, hint: "Short name used in the menu and on cards, for example: Healthcare" }
      - { label: Page heading, name: title, widget: string, hint: "Big heading at the top of the page" }
      - { label: Intro text, name: heroText, widget: text, required: false, hint: "One or two sentences under the heading" }
      - { label: Header photo, name: image, widget: image, required: false, hint: "Upload a photo or paste a link to one" }
      - { label: Position in section, name: order, widget: number, value_type: int, default: 99, hint: "1 = first in the menu" }
      - { label: Google description, name: description, widget: text, required: false, hint: "Shown in Google results. About 150 characters." }
      - { label: Card text (optional), name: cardText, widget: text, required: false, hint: "Text on the section overview card. Empty = uses the intro text." }
      - { label: Hide this page (draft), name: draft, widget: boolean, required: false, default: false }
      # Content blocks (also used by Sections below)
      - &blocks
        label: Content blocks
        name: blocks
        widget: list
        label_singular: block
        summary: "{{fields.heading}}"
        required: false
        hint: Each block is one white card on the page. Drag blocks to change their order.
        fields:
          - label: Heading
            name: heading
            widget: string
            required: false
          - label: Text
            name: text
            widget: richtext
            required: false
            hint: "Tip: a quote (>) shows as a blue note box."
          - label: "Advanced: HTML inside the card"
            name: html
            widget: text
            required: false
            hint: Used by older blocks with special boxes or grids. You can edit the words, but keep the <tags> as they are. For new blocks, use Text instead.
          - label: "Advanced: custom block (calculators)"
            name: custom
            widget: text
            required: false
            hint: Replaces the whole card. Only for calculators and special layouts.
      - { label: Photo description (optional), name: imageAlt, widget: string, required: false }
      - { label: Card photo (optional), name: cardImage, widget: image, required: false, hint: "Empty = uses the header photo" }
      - { label: Browser tab title (optional), name: seoTitle, widget: string, required: false, hint: "Shown in Google results. Keep it under 40 characters. Empty = uses the page heading." }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }

  - name: sections
    label: Sections
    label_singular: Section
    description: The main sections (Expat Info, Lifestyle, …). Getting Started and Safety are single-page sections.
    folder: content/sections
    extension: md
    format: frontmatter
    create: true
    delete: false
    identifier_field: name
    slug: "{{fields.name}}"
    summary: "{{fields.number}} · {{fields.name}}"
    sortable_fields:
      fields: [order, name]
      default: { field: order }
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Number, name: number, widget: string, hint: "Shown on the page, for example 02" }
      - { label: Position, name: order, widget: number, value_type: int }
      - { label: Colour, name: colour, widget: color, hint: "Soft background colour for this section" }
      - { label: Show in top menu, name: inTopMenu, widget: boolean, required: false, default: false }
      - { label: Intro text, name: intro, widget: text, required: false, hint: "Text at the top of the section page" }
      - { label: "About this section (under the guide cards)", name: overview, widget: markdown, required: false, hint: "A short helpful paragraph for readers and Google. Links to the most useful guides work well." }
      - { label: Home page text, name: homeText, widget: text, required: false }
      - { label: Home page photo, name: homeImage, widget: image, required: false }
      - { label: Home page label (optional), name: homeTag, widget: string, required: false, hint: "Empty = shows the number of guides" }
      - { label: Google description, name: description, widget: text, required: false }
      - { label: Browser tab title (optional), name: seoTitle, widget: string, required: false }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }
      - { label: "Single page (no guides)", name: singlePage, widget: boolean, required: false, default: false, hint: "Turn on for sections like Getting Started. Then fill in the fields below." }
      - { label: "Single page: heading", name: title, widget: string, required: false }
      - { label: "Single page: intro text", name: heroText, widget: text, required: false }
      - { label: "Single page: header photo", name: image, widget: image, required: false }
      - *blocks

  - name: pages
    label: Pages
    label_singular: Page
    description: Standalone pages such as About, Contact and Privacy Policy. Tick "Show in footer" to link a page in the footer.
    folder: content/pages
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: menuName
    slug: "{{fields.menuName}}"
    summary: "{{fields.menuName}}  ·  Updated {{commit_date | date('D MMM YYYY, HH:mm')}}"
    fields:
      - { label: Short name, name: menuName, widget: string, hint: "Used in the footer link and the web address, for example: About" }
      - { label: Page heading, name: title, widget: string }
      - { label: Intro text, name: heroText, widget: text, required: false }
      - { label: Header photo, name: image, widget: image, required: false }
      - { label: Photo description, name: imageAlt, widget: string, required: false }
      - { label: Show in footer, name: inFooter, widget: boolean, required: false, default: true }
      - { label: Position in footer, name: footerOrder, widget: number, value_type: int, required: false, default: 99, hint: "1 = first" }
      - { label: Google description, name: description, widget: text, required: false }
      - { label: Hide this page (draft), name: draft, widget: boolean, required: false, default: false }
      - *blocks
      - { label: Browser tab title (optional), name: seoTitle, widget: string, required: false }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }

  - name: tools-page
    label: Overview pages
    description: The text on the Tools, Blog and Map pages.
    files:
      - name: tools-page
        label: Tools page
        file: content/tools-page.md
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Intro text, name: heroText, widget: text }
          - { label: Note under the tools, name: note, widget: string, hint: "Shown on every tool page too." }
          - { label: Text for search engines, name: description, widget: text, required: false }
          - { label: "About these calculators (bottom of the page)", name: overview, widget: markdown, required: false }
      - name: blog-page
        label: Blog page
        file: content/blog-page.md
        format: frontmatter
        fields:
          - { label: Intro text, name: heroText, widget: text }
          - { label: Text for search engines, name: description, widget: text, required: false }
          - { label: "About our blog (bottom of the page)", name: overview, widget: markdown, required: false }
      - name: map-page
        label: Map page
        file: content/map-page.md
        format: frontmatter
        fields:
          - { label: Text for search engines, name: description, widget: text, required: false }
          - { label: "About this map (under the map)", name: overview, widget: markdown, required: false }

  - name: tools
    label: Tools
    label_singular: tool
    description: "The calculators. You can edit the text, FAQs, rent prices and costs. Tax rates are in assets/tools.js (ask a developer to update them each year)."
    folder: content/tools
    format: frontmatter
    create: false
    delete: false
    summary: "{{fields.menuName}}"
    sortable_fields: [order, menuName]
    fields:
      - { label: Page heading, name: title, widget: string }
      - { label: Short name (cards and menu), name: menuName, widget: string }
      - { label: Order, name: order, widget: number, value_type: int }
      - { label: Colour, name: colour, widget: color }
      - { label: Symbol on the card, name: symbol, widget: string, hint: "One character, for example € or %" }
      - { label: Card text, name: summary, widget: text }
      - { label: Intro text, name: heroText, widget: text }
      - { label: Text for search engines, name: description, widget: text, required: false }
      - { label: "How it works", name: howItWorks, widget: markdown }
      - label: FAQs
        name: faqs
        widget: list
        label_singular: question
        summary: "{{fields.question}}"
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - label: "Rent prices (Rent Price Checker only)"
        name: areas
        widget: list
        required: false
        label_singular: area
        summary: "{{fields.name}}: 1-bed €{{fields.oneBedLow}}–{{fields.oneBedHigh}}"
        hint: "Monthly rent in euro. Studio and 3-bedroom prices are worked out from these."
        fields:
          - { label: Area, name: name, widget: string }
          - { label: "1 bedroom: from", name: oneBedLow, widget: number, value_type: int }
          - { label: "1 bedroom: to", name: oneBedHigh, widget: number, value_type: int }
          - { label: "2 bedrooms: from", name: twoBedLow, widget: number, value_type: int }
          - { label: "2 bedrooms: to", name: twoBedHigh, widget: number, value_type: int }
      - { label: "Studio price (part of 1-bed price)", name: studioFactor, widget: number, value_type: float, required: false, hint: "Rent Price Checker only. 0.75 = 75%." }
      - { label: "3-bed price (times 2-bed price)", name: threeBedFactor, widget: number, value_type: float, required: false, hint: "Rent Price Checker only. 1.35 = 135%." }
      - label: "Monthly costs (Cost of Living Calculator only)"
        name: costs
        widget: object
        required: false
        collapsed: true
        fields:
          - label: Electricity and water, by home size
            name: utilities
            widget: object
            fields:
              - { label: Studio, name: studio, widget: number }
              - { label: 1 bedroom, name: one, widget: number }
              - { label: 2 bedrooms, name: two, widget: number }
              - { label: 3 bedrooms, name: three, widget: number }
          - { label: Internet (per home), name: internet, widget: number }
          - { label: Mobile (per adult), name: mobilePerAdult, widget: number }
          - { label: Car (per month), name: car, widget: number }
          - { label: Health insurance per adult, name: healthAdult, widget: number }
          - { label: Health insurance per child, name: healthChild, widget: number }
          - { label: State school extras per child, name: schoolState, widget: number }
          - { label: Church school per child, name: schoolChurch, widget: number }
          - { label: Private school per child, name: schoolPrivate, widget: number }
          - { label: Groceries per adult, name: groceriesAdult, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
          - { label: Groceries per child, name: groceriesChild, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
          - { label: Transport per adult, name: transportAdult, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
          - { label: Eating out and free time per adult, name: leisureAdult, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
          - { label: Personal care and gym per adult, name: personalAdult, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
          - { label: Clothes and household (per home), name: householdOther, widget: object, fields: [{ label: Basic, name: basic, widget: number }, { label: Moderate, name: moderate, widget: number }, { label: Comfortable, name: comfortable, widget: number }] }
