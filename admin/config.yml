# Admin panel settings (Sveltia CMS).
# Open https://maltaexpatguide.com/admin/ and choose "Sign In with Token".

backend:
  name: github
  repo: Jaseto881810/malta-expat-hub
  branch: main
  commit_messages:
    create: "Add {{collection}} page “{{slug}}”"
    update: "Update {{collection}} page “{{slug}}”"
    delete: "Delete {{collection}} page “{{slug}}”"

site_url: https://maltaexpatguide.com
display_url: https://maltaexpatguide.com

# Uploaded photos are stored here.
media_folder: assets/images
public_folder: /assets/images

collections:
  - name: guides
    label: Guides
    label_singular: Guide
    description: The guide pages inside each section (for example Healthcare or Renting).
    folder: content/guides
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: menuName
    slug: "{{fields.menuName}}"
    summary: "{{fields.menuName}}"
    sortable_fields:
      fields: [menuName, section, order]
      default: { field: section }
    view_groups:
      - { label: Section, field: section }
    fields:
      - label: Section
        name: section
        widget: relation
        collection: sections
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { label: Name in menu, name: menuName, widget: string, hint: "Short name used in the menu and on cards, for example: Healthcare" }
      - { label: Page heading, name: title, widget: string, hint: "Big heading at the top of the page" }
      - { label: Intro text, name: heroText, widget: text, required: false, hint: "One or two sentences under the heading" }
      - { label: Header photo, name: image, widget: image, required: false, hint: "Upload a photo or paste a link to one" }
      - { label: Position in section, name: order, widget: number, value_type: int, default: 99, hint: "1 = first in the menu" }
      - { label: Google description, name: description, widget: text, required: false, hint: "Shown in Google results. About 150 characters." }
      - { label: Card text (optional), name: cardText, widget: text, required: false, hint: "Text on the section overview card. Empty = uses the intro text." }
      - { label: Hide this page (draft), name: draft, widget: boolean, required: false, default: false }
      # Content blocks (also used by Sections below)
      - &blocks
        label: Content blocks
        name: blocks
        widget: list
        label_singular: block
        summary: "{{fields.heading}}"
        hint: Each block is one white card on the page. Drag blocks to change their order.
        fields:
          - label: Heading
            name: heading
            widget: string
            required: false
          - label: Text
            name: text
            widget: richtext
            required: false
            hint: "Tip: a quote (>) shows as a blue note box."
          - label: "Advanced: HTML inside the card"
            name: html
            widget: text
            required: false
            hint: Used by older blocks with special boxes or grids. You can edit the words, but keep the <tags> as they are. For new blocks, use Text instead.
          - label: "Advanced: custom block (calculators)"
            name: custom
            widget: text
            required: false
            hint: Replaces the whole card. Only for calculators and special layouts.
      - { label: Photo description (optional), name: imageAlt, widget: string, required: false }
      - { label: Card photo (optional), name: cardImage, widget: image, required: false, hint: "Empty = uses the header photo" }
      - { label: Browser tab title (optional), name: seoTitle, widget: string, required: false, hint: "Empty = uses the name in menu" }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }

  - name: sections
    label: Sections
    label_singular: Section
    description: The main sections (Expat Info, Lifestyle, …). Getting Started and Safety are single-page sections.
    folder: content/sections
    extension: md
    format: frontmatter
    create: true
    delete: false
    identifier_field: name
    slug: "{{fields.name}}"
    summary: "{{fields.number}} · {{fields.name}}"
    sortable_fields:
      fields: [order, name]
      default: { field: order }
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Number, name: number, widget: string, hint: "Shown on the page, for example 02" }
      - { label: Position, name: order, widget: number, value_type: int }
      - { label: Colour, name: colour, widget: color, hint: "Soft background colour for this section" }
      - { label: Show in top menu, name: inTopMenu, widget: boolean, required: false, default: false }
      - { label: Intro text, name: intro, widget: text, required: false, hint: "Text at the top of the section page" }
      - { label: Home page text, name: homeText, widget: text, required: false }
      - { label: Home page photo, name: homeImage, widget: image, required: false }
      - { label: Home page label (optional), name: homeTag, widget: string, required: false, hint: "Empty = shows the number of guides" }
      - { label: Google description, name: description, widget: text, required: false }
      - { label: Browser tab title (optional), name: seoTitle, widget: string, required: false }
      - { label: Social share photo (optional), name: shareImage, widget: image, required: false }
      - { label: "Single page (no guides)", name: singlePage, widget: boolean, required: false, default: false, hint: "Turn on for sections like Getting Started. Then fill in the fields below." }
      - { label: "Single page: heading", name: title, widget: string, required: false }
      - { label: "Single page: intro text", name: heroText, widget: text, required: false }
      - { label: "Single page: header photo", name: image, widget: image, required: false }
      - *blocks
